[package]
name = "minelander"
version = "1.0.0"
edition = "2021"
authors = ["jafkc2"]
repository = "https://github.com/jafkc2/minelander"
build = "build.rs"

[profile.release]
strip = true
lto = true

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "svg", "image"] }
reqwest = {version = "0.13.5", features = ["json"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
open = "5.4.5"
rfd = "0.15.4"
zip = "9.1.2"
uuid = { version = "1.29.0", features = ["v4"] }
md5 = "0.8.1"
shared_child = "1.0.0"
tar = "0.4.46"
flate2 = "1.1.10"
anyhow = "1.0.104"
oauth2 = "5.0.0"
minecraft-msa-auth = "0.5"
sha1 = "0.11.0"
tokio = { version = "1.54", features = ["time"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
