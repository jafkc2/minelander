[package]
name = "minelander"
version = "0.7.1"
edition = "2021"
authors = ["jafkc2"]
repository = "https://github.com/jafkc2/minelander"
build = "build.rs"

[profile.release]
strip = true
lto = true

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "svg", "image"] }
reqwest = {version = "0.13.5", features = ["json"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
open = "5.4.5"
zip = "9.0.5"
uuid = { version = "1.28.0", features = ["v4"] }
md5 = "0.8.1"
shared_child = "1.0.0"
tar = "0.4.46"
flate2 = "1.1.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
